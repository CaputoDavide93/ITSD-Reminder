<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 452" width="1180" height="452" role="img" aria-label="Each check fetches today's channel messages, keeps top-level human messages older than the age threshold that are not yet logged, and asks whether the HelpDesk bot or this bot already replied. If not, it posts a reminder in the thread. Either way the thread is logged, then the bot sleeps until the next check."><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6b7684"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 0 5 10 10z" fill="#6b7684"/></marker></defs><rect x="24" y="112" width="190" height="96" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(40.0,125.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 4a6.5 6.5 0 1 0 0 13 6.5 6.5 0 1 0 0-13z M15.5 15.5 20 20"/></g><text x="71.0" y="140.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Fetch today's</text><text x="40.0" y="164.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">channel messages,</text><text x="40.0" y="182.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">every page</text><rect x="254" y="112" width="210" height="96" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(270.0,125.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-6 7.5V19l-4 1.5v-8z"/></g><text x="301.0" y="140.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Filter messages</text><text x="270.0" y="164.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">top-level, from a person,</text><text x="270.0" y="182.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">older than 3 h, not logged</text><polygon points="598,108.0 688.0,160.0 598,212.0 508.0,160.0" fill="#1b2230" stroke="#30363d" stroke-width="1"/><text x="598.0" y="157.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e6edf3" text-anchor="middle">HelpDesk bot or</text><text x="598.0" y="171.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e6edf3" text-anchor="middle">this bot replied?</text><rect x="736" y="112" width="180" height="96" rx="10" fill="#4c7ef3" stroke="#4c7ef3" stroke-width="1"/><g transform="translate(752.0,125.0) scale(0.8750)" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3 3 10.5l7.5 3 3 7.5z M10.5 13.5 21 3"/></g><text x="783.0" y="140.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#ffffff" text-anchor="start" font-weight="600">Post a reminder</text><text x="752.0" y="164.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffffff" text-anchor="start" opacity="0.85">in the thread,</text><text x="752.0" y="182.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffffff" text-anchor="start" opacity="0.85">mentioning the author</text><rect x="958" y="112" width="198" height="96" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(974.0,125.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h8l5 5v15H6z M14 2v5h5 M9 13h6 M9 17h6"/></g><text x="1005.0" y="140.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Log the thread</text><text x="974.0" y="164.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">saved when the pass ends</text><polyline points="222,160.0 246,160.0" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><polyline points="472,160.0 500.0,160.0" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><polyline points="696.0,160.0 728,160.0" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="712.0" y="151.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">no</text><polyline points="924,160.0 950,160.0" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><polyline points="598,100.0 598,60 1057.0,60 1057.0,104" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="610.0" y="80.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="start">yes</text><rect x="470" y="286" width="240" height="76" rx="10" fill="#1b2230" stroke="#30363d" stroke-width="1"/><g transform="translate(486.0,299.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></g><text x="517.0" y="314.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Sleep 2 hours</text><text x="486.0" y="338.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">touching the heartbeat</text><polyline points="1057.0,216 1057.0,324.0 718,324.0" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><polyline points="462,324.0 119.0,324.0 119.0,216" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="294.5" y="315.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">CHECK_INTERVAL_HOURS</text><line x1="24" y1="400" x2="1156" y2="400" stroke="#232a33" stroke-width="1"/><text x="24.0" y="426.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">A thread the HelpDesk bot already answered is logged without a reminder, so no thread's replies are fetched twice.</text></svg>