<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470" role="img" aria-label="The reminder bot runs in one Docker container configured from config/.env. It reads the service desk channel and posts reminders through the Slack Web API, keeps a log of reminded threads on the ./data volume, and touches a heartbeat file that the Docker health check watches."><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#94a3b8"/></marker></defs><rect x="24" y="56" width="268" height="108" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(40.0,69.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h9 M17 6h3 M4 12h3 M11 12h9 M4 18h11 M19 18h1 M15 4v4 M9 10v4 M17 16v4"/></g><text x="71.0" y="84.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">Environment</text><text x="40.0" y="108.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">Slack token, channel and</text><text x="40.0" y="126.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">HelpDesk bot ID</text><rect x="456" y="56" width="268" height="108" rx="10" fill="#2b59c3" stroke="#2b59c3" stroke-width="1"/><g transform="translate(472.0,69.0) scale(0.8750)" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 8h8v8H8z M5 5h14v14H5z M10 2v3 M14 2v3 M10 19v3 M14 19v3 M2 10h3 M2 14h3 M19 10h3 M19 14h3"/></g><text x="503.0" y="84.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#ffffff" text-anchor="start" font-weight="600">Reminder bot</text><text x="472.0" y="108.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffffff" text-anchor="start" opacity="0.85">Checks every 2 hours, reminds</text><text x="472.0" y="126.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffffff" text-anchor="start" opacity="0.85">threads older than 3 hours</text><rect x="888" y="56" width="268" height="108" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(904.0,69.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9.5L5 20v-4H4z M8 9h8 M8 12h5"/></g><text x="935.0" y="84.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">Slack channel</text><text x="904.0" y="108.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">Tickets, HelpDesk bot replies</text><text x="904.0" y="126.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">and our reminders</text><rect x="24" y="272" width="268" height="96" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(40.0,285.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-10A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 7.5 3c0 5.4-7.5 10-7.5 10z"/></g><text x="71.0" y="300.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">Docker health check</text><text x="40.0" y="324.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">Unhealthy after 30 minutes</text><text x="40.0" y="342.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">without a heartbeat</text><rect x="456" y="272" width="210" height="96" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(472.0,285.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5-6 5 12 2.5-6h4"/></g><text x="503.0" y="300.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">Heartbeat file</text><text x="472.0" y="324.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">Touched every 15 min</text><rect x="888" y="272" width="268" height="96" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(904.0,285.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z M14 3v4h4 M9 12h6 M9 16h6"/></g><text x="935.0" y="300.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">Reminded log</text><text x="904.0" y="324.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">On the ./data volume,</text><text x="904.0" y="342.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">survives restarts</text><polyline points="300,110.0 448,110.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="374.0" y="101.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">config/.env</text><polyline points="732,110.0 880,110.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/><text x="806.0" y="101.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">history, replies</text><text x="806.0" y="131.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">chat.postMessage</text><polyline points="561.0,172 561.0,264" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><polyline points="448,320.0 300,320.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="374.0" y="311.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">HEARTBEAT_FILE</text><polyline points="690,172 690,320.0 880,320.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/><text x="793.0" y="311.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">reminded_messages.json</text><line x1="24" y1="418" x2="1156" y2="418" stroke="#e6e9ee" stroke-width="1"/><text x="24.0" y="444.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">A thread is reminded once: the log and a check for our own bot's reply both stop a second nudge.</text></svg>